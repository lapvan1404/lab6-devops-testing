
name: Student API CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Student API
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/api/students; then
              exit 0
            fi
            sleep 2
          done
          cat server.log
          exit 1

      - name: Run Newman API Tests
        run: |
          npx --yes newman run "Student API Tests.postman_collection.json" \
            --reporters cli,json \
            --reporter-json-export newman-report.json

      - name: Upload Newman Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report.json
          if-no-files-found: ignore
